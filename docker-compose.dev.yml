# Local services: Postgres, Meilisearch, Mailpit, Garage (S3). The app itself runs on the host (`pnpm dev`),
# and so does mock-services (`pnpm mock:dev`); its container here is optional, behind `--profile mock`.
# Values come from .env (copy .env.example). Every port is bound to 127.0.0.1 only.
# Image versions are pinned exactly (newest patch at least two weeks old when chosen).
name: horeca-dev

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.15-trixie
    environment:
      # The image's superuser — used only by the init script, on an empty data directory.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by deploy/postgres/init/01-roles.sh to create the three logins.
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?set POSTGRES_WORKER_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when postgres-data is empty. Reset: docker compose -f docker-compose.dev.yml down -v
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: during init the server listens on the Unix socket only,
      # so this stays unhealthy until the init script has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *logging

  meilisearch:
    image: getmeili/meilisearch:v1.56.2
    environment:
      MEILI_ENV: development
      # Locally the master key doubles as the app's API key (see .env.example).
      MEILI_MASTER_KEY: ${MEILI_API_KEY:?set MEILI_API_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # S3-compatible media storage (decision 013). After the first start run scripts/garage-setup.sh once
  # (layout, bucket, app key); until then the healthcheck reports "unhealthy" on purpose.
  garage:
    image: dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:3900:3900" # S3 API only; RPC (3901) and admin API (3903) are not published
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # The image has no shell or curl; `garage health` exits 1 while the cluster is unavailable
      # (also before the layout is applied by the setup script).
      test: ["CMD", "/garage", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # OPTIONAL — never started by a plain `up`. The normal way to run mock-services locally is
  # `pnpm mock:dev` on the host (works the same on Windows, macOS and Linux). This container runs the
  # BUNDLED entry instead, the way the server does:
  #   pnpm build:entries && docker compose -f docker-compose.dev.yml --profile mock up -d mock-services
  # It mounts ./dist and ./node_modules read-only (pure-JavaScript dependencies only: zod, pino). pnpm's
  # node_modules is made of links: on Windows the mount may not resolve them — use `pnpm mock:dev` there.
  # Do not run both at once: they share port 4010.
  mock-services:
    profiles: ["mock"]
    # Same Node as the app image (Dockerfile → NODE_IMAGE).
    image: node:26.13.1-trixie-slim@sha256:abe7e5a82b61a8ef67b315b85497c9e65173387ccf2f4a029248184b8e020be5
    init: true
    user: node
    working_dir: /app
    command: ["node", "--max-old-space-size=64", "dist/mock-services.mjs"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SUPPLIER_API_KEY: ${SUPPLIER_API_KEY:?set SUPPLIER_API_KEY in .env}
      MOCK_SERVICES_HOST: 0.0.0.0 # inside the container; published on 127.0.0.1 only
      MOCK_SERVICES_PORT: "4010"
      MOCK_SUPPLIER_BEHAVIOUR: ${MOCK_SUPPLIER_BEHAVIOUR:-}
      MOCK_DEFAULT_STOCK: ${MOCK_DEFAULT_STOCK:-}
    ports:
      - "127.0.0.1:4010:4010"
    volumes:
      - ./dist:/app/dist:ro
      - ./node_modules:/app/node_modules:ro
    mem_limit: 96m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4010/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

volumes:
  postgres-data:
  meili-data:
  garage-meta:
  garage-data:
