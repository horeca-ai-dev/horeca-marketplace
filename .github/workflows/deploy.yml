# Deploy (D3-A1) — every push to main: build ONE image → deploy it to staging → G0 smoke test.
#
#   build           buildx (GitHub Actions cache) → ghcr.io/horeca-ai-dev/horeca-marketplace:<sha>
#   deploy-staging  Environment "staging": join the tailnet (Tailscale federated identity, no secret)
#                   → ssh deploy@server "staging <sha>" (the key is forced to run deploy.sh)
#   smoke-staging   fresh runner, NOT on the tailnet → scripts/smoke-g0.sh via public DNS, so it
#                   tests the real public path through both proxies
#   production      TODO(D5-A1)
#
# The PR's CI (ci.yml) has already passed before anything reaches main. Every action is pinned to a
# full commit SHA (tag in the comment), each release at least two weeks old when chosen.
# Secrets (GitHub → Settings → Environments → staging): README → Deployment → "GitHub setup".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/horeca-ai-dev/horeca-marketplace

jobs:
  build:
    name: build image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails the job (and so the deploy) if the image cannot be built or pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            INSTALL_CHROMIUM=1
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: deploy staging
    needs: build
    if: github.ref == 'refs/heads/main' # workflow_dispatch from another branch never deploys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The Environment makes the OIDC subject repo:…:environment:staging, which the Tailscale
    # federated credential trusts; its secrets are only visible to this job.
    environment:
      name: staging
      url: https://staging.horeca.bogdandelic.online
    # One staging deploy at a time; a running deploy is never cancelled halfway (migrations).
    concurrency:
      group: staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Tailscale federated identity (workload identity federation)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Deploy (deploy.sh staging <sha>)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy
          # The server's forced command ignores what we "run" except as $SSH_ORIGINAL_COMMAND.
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_deploy" \
            -o ConnectTimeout=20 \
            "deploy@${DEPLOY_HOST}" "staging ${SHA}"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts_deploy

  smoke-staging:
    name: smoke test staging
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A fresh runner that never joins the tailnet: it resolves the domain through public DNS and
    # reaches the app the way a user does (friend's proxy → Tailscale → our Nginx → app).
    # The Environment is only for the basic-auth secrets. No concurrency group: a smoke run may
    # overlap the next deploy and then tests whatever is live; the next run checks again.
    environment:
      name: staging
      url: https://staging.horeca.bogdandelic.online
    permissions:
      contents: read # no id-token: this job never joins the tailnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: G0 smoke test (through both proxies)
        env:
          SMOKE_BASE_URL: https://staging.horeca.bogdandelic.online
          SMOKE_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          SMOKE_BASIC_AUTH_PASS: ${{ secrets.STAGING_BASIC_AUTH_PASS }}
        run: scripts/smoke-g0.sh

  # TODO(D5-A1): production half —
  #   deploy-production:
  #     needs: deploy-staging
  #     environment: production          # required reviewers: both team members (approval gate)
  #     concurrency: { group: production, cancel-in-progress: false }
  #     permissions: { contents: write, id-token: write }   # contents: write for the release tag
  #     steps: tailscale (same inputs, production Environment secrets) → ssh "production <sha>"
  #            (deploy.sh: pre-deploy pg_dump → migrate → health) → tag vX.Y.Z + GitHub Release
