# CI (D3-B0) — runs on every pull request into main and on every push to main.
#
#   checks    lint · format · typecheck · commit messages · secrets (gitleaks) · audit · unit tests · build
#   database  migration check · migrate entry on an empty database (twice) · integration tests
#
# Both jobs must be green before a PR is merged (set them as required checks in the main ruleset).
# Every action is pinned to a full commit SHA (the tag is in the comment) and was at least two weeks
# old when chosen; Node and pnpm versions come from .nvmrc and package.json "packageManager".
#
# Later: Testcontainers replaces the Compose services for integration tests (D3-B1); the RLS SQL
# tests run with psql against the real migrations (D4-B2).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint and gitleaks read the history
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Commit messages (commits of this PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Secrets (gitleaks, whole history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

      - name: Audit (high and critical)
        run: pnpm audit --audit-level high

      - name: Unit tests
        run: pnpm test

      - name: Build (without any environment variables, like the Docker build)
        run: pnpm build

      - name: Bundle the worker and migrate entries (as the Docker image does)
        run: pnpm build:entries

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same services and the same init script (three logins) as on our laptops.
      - name: Start Postgres and Mailpit
        run: |
          cp .env.example .env
          docker compose -f docker-compose.dev.yml up -d --wait postgres mailpit

      - name: Migration files are consistent
        run: pnpm db:check

      - name: Migrate entry on an empty database (twice — it must be safe to repeat)
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: Service logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs postgres mailpit
