allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Pulled in by next-intl, which uses them only for message extraction (useExtracted / getExtracted
  # and the `experimental.extract` plugin option) — we write messages/*.json by hand. Their install
  # scripts stay off: both ship prebuilt binaries as optional packages (@swc/core-<platform>,
  # @parcel/watcher-<platform>); the scripts only check for / compile a fallback.
  "@parcel/watcher": false
  "@swc/core": false

# @tanstack/react-table 9.3.1 asks for @tanstack/react-store ^0.11.2; on 27.11.2026 that range
# resolved to 0.11.4 (+ @tanstack/store 0.11.3), published 22.11.2026 — younger than our 14-day
# minimum. Pinned to 0.11.2 (29.09.2026), the version table-core 9.3.1 was released against.
# Drop the pins once a newer pair is old enough and the update is checked.
overrides:
  "@tanstack/react-store": 0.11.2
  "@tanstack/store": 0.11.2

# Our two-week rule (CLAUDE.md rule 17) enforced by pnpm itself: a version is only resolved once it has been
# published for 14 days (the value is in minutes). Needed since @aws-sdk/client-s3 (D5-B3b): its dependency
# ranges are open and the AWS packages are released almost daily, so a plain install pulls in a dozen
# packages younger than two weeks. Only NEW resolutions are affected; the overrides above stay as they are.
minimumReleaseAge: 20160
# pnpm also checks the packages ALREADY in pnpm-lock.yaml against that rule. These 51 exact versions (installed
# before the rule existed: typescript-eslint, Babel, browserslist, jose, cron-parser, next-intl's formatjs …) were
# younger than 14 days on 27.11.2026. They are listed here, as exact versions, and nothing else is.
# TEMPORARY: the newest of them (typescript-eslint 8.74.0, 23.11.) turns 14 days old on 7.12.2026 — on that
# day delete this whole list (TASKS.md has the reminder). Never add a name here to get a NEW package past the rule.
minimumReleaseAgeExclude:
  - "@babel/generator@7.29.15"
  - "@babel/helper-string-parser@7.29.15"
  - "@babel/helpers@7.29.15"
  - "@babel/parser@7.29.15"
  - "@babel/plugin-transform-typescript@7.29.15"
  - "@babel/traverse@7.29.15"
  - "@babel/types@7.29.15"
  - "@eloqnt/config@0.1.2"
  - "@eloqnt/format-json@0.1.1"
  - "@eloqnt/format-po@0.1.2"
  - "@formatjs/fast-memoize@3.1.8"
  - "@tybys/wasm-util@0.10.5"
  - "@typescript-eslint/eslint-plugin@8.74.0"
